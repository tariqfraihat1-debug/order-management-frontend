<div class="input-group">

  @if (currencyCode()) {
    <span class="input-group-text">
      {{ currencyCode() }}
    </span>
  }

  <input
    type="number"
    class="form-control"
    min="0"
    [step]="getStep()"
    [value]="value() ?? ''"
    [disabled]="disabled()"
    (input)="onInput($event)">

</div>
