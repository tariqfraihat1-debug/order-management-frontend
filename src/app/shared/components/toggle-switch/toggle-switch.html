<div class="form-check form-switch">

  <input
    class="form-check-input"
    type="checkbox"
    role="switch"
    [checked]="checked()"
    [disabled]="disabled()"
    (change)="onChange($event)">

  @if (label()) {
    <label class="form-check-label">
      {{ label() }}
    </label>
  }

</div>
