<div class="bg-white border-bottom px-4 py-3">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2">

    <div>
      <ng-container
        [ngTemplateOutlet]="leftTemplate()">
      </ng-container>
    </div>

    @if (rightTemplate()) {
      <div>
        <ng-container
          [ngTemplateOutlet]="rightTemplate()!">
        </ng-container>
      </div>
    }

  </div>
</div>
