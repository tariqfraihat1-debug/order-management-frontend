<!-- Loading state -->
@if(loading()){
  <app-loading message="Loading customer..."></app-loading>
}

<!-- Error state -->
@else if(error()){
  <div class="alert alert-danger">
    {{error()}}
  </div>
}

<!-- Customer edit content -->
@else if(customer(); as data){
  <!-- Page header -->
  <ng-template #headerLeft>
    <app-breadcrumb
      [items]="[
        {
          label:'Customers',
          link:'/customers'
        },
        {
          label:data.customerName,
          link:'/customers/'+data.customerId
        },
        {
          label:'Edit'
        }
      ]">
    </app-breadcrumb>

    <h1 class="page-title fw-bold mb-0 mt-2">
      Edit Customer
    </h1>
  </ng-template>

  <!-- Content header -->
  <app-content-header
    [leftTemplate]="headerLeft">
  </app-content-header>

  <!-- Customer form -->
  <div class="p-4">
    <app-customer-form
      [customer]="data"
      (saved)="updateCustomer($event)"
      (cancelled)="cancel()">
    </app-customer-form>
  </div>
}
