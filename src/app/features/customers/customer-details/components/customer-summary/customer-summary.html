<!-- Customer summary card -->
<div class="card">
  <div class="card-body">
    <div class="row g-4">
      @for(field of fields(); track field.label){
        <div class="col-md-4">
          <app-detail-field
            [label]="field.label"
            [value]="field.value">
          </app-detail-field>
        </div>
      }
    </div>
  </div>
</div>
