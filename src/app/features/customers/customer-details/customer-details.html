@if(loading()){

<app-loading message="Loading customer details..."></app-loading>

}
@else if(loadError()){

<div class="alert alert-danger">
{{loadError()}}
</div>

}
@else if(customer(); as data){


<ng-template #headerLeft>

<app-breadcrumb
[items]="[
{
label:'Customers',
link:'/customers'
},
{
label:data.customerName
}
]">
</app-breadcrumb>


<h1 class="page-title fw-bold mb-0 mt-2">
{{data.customerName}}
</h1>

</ng-template>



<ng-template #headerRight>

<div class="d-flex align-items-center gap-2">


<app-status-badge
[status]="data.isActive ? 'Active':'Inactive'">
</app-status-badge>



<button
class="btn btn-outline-secondary btn-sm"
(click)="editCustomer()">

Edit

</button>



<button
class="btn btn-sm"
[class.btn-outline-danger]="data.isActive"
[class.btn-outline-success]="!data.isActive"
(click)="toggleStatus()">

{{data.isActive ? 'Deactivate':'Activate'}}

</button>


</div>

</ng-template>



<app-content-header
[leftTemplate]="headerLeft"
[rightTemplate]="headerRight">
</app-content-header>



<div class="p-4">


<app-customer-summary
[customer]="data">
</app-customer-summary>



<div class="mt-3">

<app-customer-orders
[orders]="orders()">
</app-customer-orders>

</div>


</div>



<app-confirm-dialog
[open]="showConfirmDialog()"
[title]="confirmationTitle()"
[message]="confirmationMessage()"
[confirmText]="confirmationText()"
[danger]="isDangerAction()"
(confirmed)="confirmStatusChange()"
(cancelled)="cancelStatusDialog()">
</app-confirm-dialog>


}
