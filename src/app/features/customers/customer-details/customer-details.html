<!-- Loading state -->
@if(loading()){
  <app-loading message="Loading customer details..."></app-loading>
}

<!-- Error state -->
@else if(loadError()){
  <div class="alert alert-danger">
    {{loadError()}}
  </div>
}

<!-- Customer details content -->
@else if(customer(); as data){
  <!-- Header left content -->
  <ng-template #headerLeft>
    <app-breadcrumb
      [items]="[
        {
          label:'Customers',
          link:'/customers'
        },
        {
          label:data.customerName
        }
      ]">
    </app-breadcrumb>

    <h1 class="page-title fw-bold mb-0 mt-2">
      {{data.customerName}}
    </h1>
  </ng-template>

  <!-- Header right actions -->
  <ng-template #headerRight>
    <div class="d-flex align-items-center gap-2">
      <app-status-badge
        [status]="data.isActive ? 'Active':'Inactive'">
      </app-status-badge>

<app-button
  variant="secondary"
  (clicked)="editCustomer()">
  Edit
</app-button>

 <app-button
  [variant]="data.isActive ? 'danger' : 'success'"
  (clicked)="toggleStatus()">
  {{data.isActive ? 'Deactivate' : 'Activate'}}
</app-button>
    </div>
  </ng-template>

  <!-- Content header -->
  <app-content-header
    [leftTemplate]="headerLeft"
    [rightTemplate]="headerRight">
  </app-content-header>

  <!-- Customer details -->
  <div class="p-4">
    <app-customer-summary
      [customer]="data">
    </app-customer-summary>

    <!-- Customer orders -->
    <div class="mt-3">
      <app-customer-orders
        [orders]="orders()">
      </app-customer-orders>
    </div>
  </div>

  <!-- Status confirmation dialog -->
  <app-confirm-dialog
    [open]="showConfirmDialog()"
    [title]="confirmationTitle()"
    [message]="confirmationMessage()"
    [confirmText]="confirmationText()"
    [danger]="isDangerAction()"
    (confirmed)="confirmStatusChange()"
    (cancelled)="cancelStatusDialog()">
  </app-confirm-dialog>
}
