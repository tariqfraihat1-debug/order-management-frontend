<!-- Page header -->
<ng-template #headerLeft>
  <app-breadcrumb
    [items]="[
      {
        label:'Customers',
        link:'/customers'
      },
      {
        label:'Create Customer'
      }
    ]">
  </app-breadcrumb>

  <h1 class="page-title fw-bold mb-0 mt-2">
    Create Customer
  </h1>
</ng-template>

<!-- Content header -->
<app-content-header
  [leftTemplate]="headerLeft">
</app-content-header>

<!-- Customer form section -->
<div class="p-4">
  @if(error()){
    <div class="alert alert-danger">
      {{error()}}
    </div>
  }

  <!-- Customer form -->
  <app-customer-form
    (saved)="createCustomer($event)"
    (cancelled)="cancel()">
  </app-customer-form>
</div>
