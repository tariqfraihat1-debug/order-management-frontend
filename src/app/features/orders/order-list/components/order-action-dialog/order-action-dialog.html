@if(order(); as data){

  @if(showMenu()){

    <div class="modal d-block" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

          <div class="modal-header">
            <h5 class="modal-title">
              Order Actions
            </h5>

            <button
              class="btn-close"
              (click)="cancelled.emit()">
            </button>
          </div>

          <div class="modal-body">
            <p class="text-secondary">
              Choose an action for this order.
            </p>

            <div class="d-flex justify-content-end gap-2">

              @if(data.orderStateName === 'Pending'){
                <app-button
                  variant="primary"
                  (clicked)="chooseAction('confirm')">
                  Confirm Order
                </app-button>

                <app-button
                  variant="outline-danger"
                  (clicked)="chooseAction('cancel')">
                  Cancel Order
                </app-button>
              }

              @if(data.orderStateName === 'Confirmed'){
                <app-button
                  variant="success"
                  (clicked)="chooseAction('ship')">
                  Ship Order
                </app-button>

                <app-button
                  variant="outline-danger"
                  (clicked)="chooseAction('cancel')">
                  Cancel Order
                </app-button>
              }

            </div>
          </div>

        </div>
      </div>
    </div>

    <div class="modal-backdrop show"></div>

  }

  <app-confirm-dialog
    [open]="showConfirm()"
    [title]="confirmationTitle()"
    [message]="confirmationMessage()"
    [confirmText]="confirmationText()"
    [danger]="isDangerAction()"
    (confirmed)="confirmed.emit()"
    (cancelled)="cancelled.emit()">
  </app-confirm-dialog>

}
