<ng-template #ordersLeft>
  <h1 class="page-title fw-bold mb-0">
    Orders
  </h1>
</ng-template>

<ng-template #ordersRight>
  <a
    routerLink="/orders/create"
    class="btn btn-primary">
    + New Order
  </a>
</ng-template>

<app-content-header
  [leftTemplate]="ordersLeft"
  [rightTemplate]="ordersRight">
</app-content-header>

<div class="p-4">

@if(loading()){
  <app-loading message="Loading orders..."></app-loading>
}
@else if(loadError()){
  <div class="alert alert-danger">
    {{loadError()}}
  </div>
}
@else{

  @if(actionError()){
    <div class="alert alert-danger">
      {{actionError()}}
    </div>
  }

  <div class="card">

    <div class="card-body border-bottom py-3">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">

        <app-order-filter
          [customers]="customers()"
          [search]="search()"
          [status]="statusFilter()"
          [customer]="customerFilter()"
          [date]="dateFilter()"
          (searchChanged)="onSearch($event)"
          (statusChanged)="onStatusChange($event)"
          (customerChanged)="onCustomerChange($event)"
          (dateChanged)="onDateChange($event)">
        </app-order-filter>

        <span class="small text-secondary">
          {{filteredOrders().length}} orders
        </span>

      </div>
    </div>

    @if(filteredOrders().length===0){
      <div class="card-body">

        @if(search() || statusFilter() || customerFilter() || dateFilter()){
          <app-empty-state
            icon="search"
            title="No orders match your filters"
            message="Try adjusting your search or filters, or clear all filters to see every order."
            primaryText="Clear Filters"
            (primaryAction)="clearFilters()">
          </app-empty-state>
        }
        @else{
          <app-empty-state
            icon="orders"
            title="No orders yet"
            message="Start by creating your first order for an active customer."
            primaryText="Create First Order"
            primaryLink="/orders/create">
          </app-empty-state>
        }

      </div>
    }
    @else{

      <app-order-table
        [orders]="filteredOrders()"
        (actionSelected)="onActionSelected($event)"
        (deleteSelected)="onDeleteSelected($event)"
        (sortSelected)="sortBy($event)">
      </app-order-table>

    }

  </div>

}

</div>

<app-order-action-dialog
  [order]="selectedOrder()"
  [showMenu]="showActionMenu()"
  [showConfirm]="showConfirmDialog()"
  [selectedAction]="selectedAction()"
  (actionSelected)="chooseAction($event)"
  (confirmed)="confirmSelectedAction()"
  (cancelled)="cancelDialog()">
</app-order-action-dialog>
