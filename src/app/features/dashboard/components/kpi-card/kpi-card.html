<div class="card h-100" [class.border-warning]="kpi().highlight" [class.cursor-pointer]="kpi().clickable" (click)="kpi().clickable && selected.emit()">
  <div class="card-body">
    <p class="small fw-bold text-secondary text-uppercase mb-2">{{ kpi().label }}</p>
    <h2 class="fw-bold mb-0">{{ kpi().value }}</h2>
  </div>
</div>
