<div class="card-body">
  @if (segments().length === 0) {
    <p class="text-secondary mb-0">No order status data available.</p>
  } @else {
    <div class="progress mb-3" role="progressbar" aria-label="Order status distribution">
      @for (segment of segments(); track segment.status) {
        <div
          class="progress-bar cursor-pointer"
          [class.bg-warning]="segment.status === 'Pending'"
          [class.bg-primary]="segment.status === 'Confirmed'"
          [class.bg-success]="segment.status === 'Shipped'"
          [class.bg-danger]="segment.status === 'Cancelled'"
          [style.width.%]="segment.percentage"
          (click)="statusSelected.emit(segment.status)">
        </div>
      }
    </div>

    <div class="d-flex flex-wrap gap-4">
      @for (segment of segments(); track segment.status) {
        <div class="d-flex align-items-center gap-2 cursor-pointer" (click)="statusSelected.emit(segment.status)">
          <span
            class="distribution-dot"
            [class.bg-warning]="segment.status === 'Pending'"
            [class.bg-primary]="segment.status === 'Confirmed'"
            [class.bg-success]="segment.status === 'Shipped'"
            [class.bg-danger]="segment.status === 'Cancelled'">
          </span>

          <span class="small text-secondary">{{ segment.status }}</span>
          <strong class="small">{{ segment.count }}</strong>
          <span class="small text-secondary">({{ segment.percentage | number:'1.0-0' }}%)</span>
        </div>
      }
    </div>
  }
</div>
