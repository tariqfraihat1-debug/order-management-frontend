<!-- Dashboard header -->
<ng-template #dashboardLeft>
  <p class="small text-secondary mb-1">
    Welcome back,
    <strong class="text-body">
      {{username()}}
    </strong>
  </p>

  <h1 class="page-title fw-bold mb-0">
    Dashboard
  </h1>
</ng-template>

<ng-template #dashboardRight>
  <span class="small text-secondary">
    {{today | date:'EEEE, MMMM d, y'}}
  </span>
</ng-template>

<app-content-header
  [leftTemplate]="dashboardLeft"
  [rightTemplate]="dashboardRight">
</app-content-header>


<div class="p-4">

  <!-- Loading state -->
  @if(loading()){
    <app-loading message="Loading dashboard..."></app-loading>
  }

  <!-- Error state -->
  @else if(error()){
    <div class="alert alert-danger" role="alert">
      {{error()}}
    </div>
  }

  <!-- Dashboard content -->
  @else if(dashboard(); as data){

    <!-- KPI cards -->
    <div class="row g-3 mb-3">
      @for(kpi of kpis(); track kpi.label){
        <div class="col-12 col-md-6 col-xl-3">
          <app-kpi-card
            [kpi]="kpi"
            (selected)="onKpiClick(kpi)">
          </app-kpi-card>
        </div>
      }
    </div>


    <!-- Order status distribution -->
    <app-order-status-distribution
      [segments]="data.orderStatusDistribution"
      [totalOrders]="data.totalOrders"
      (statusSelected)="onStatusSelected($event)">
    </app-order-status-distribution>


    <!-- Quick actions and recent orders -->
    <div class="row g-3 mt-1">

      <div class="col-12 col-lg-3">
        <app-quick-actions
          [pendingOrders]="data.pendingReview"
          [inactiveCustomers]="inactiveCustomers()">
        </app-quick-actions>
      </div>


      <div class="col-12 col-lg-9">
        <app-recent-orders
          [orders]="data.recentOrders">
        </app-recent-orders>
      </div>

    </div>

  }

</div>
